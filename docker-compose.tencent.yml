name: drone-doctor

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.tencent}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.tencent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.tencent}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - drone-doctor
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_VERSION: ${APP_VERSION:-1.3.2}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PGSSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.tencent}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      UPLOAD_DIR: /app/uploads
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_BASE: ${DEEPSEEK_API_BASE:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      ZHIPU_API_BASE: ${ZHIPU_API_BASE:-}
      ZHIPU_VISION_MODEL: ${ZHIPU_VISION_MODEL:-}
    volumes:
      - backend_uploads:/app/uploads
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 10
    networks:
      - drone-doctor
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
        VITE_PERSONAL_LEARNING_EDITION: "${VITE_PERSONAL_LEARNING_EDITION:-true}"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - drone-doctor
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - drone-doctor
    logging: *default-logging

volumes:
  postgres_data:
  backend_uploads:
  caddy_data:
  caddy_config:

networks:
  drone-doctor:
    driver: bridge
