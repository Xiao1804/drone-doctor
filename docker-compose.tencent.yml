services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.tencent}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.tencent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.tencent}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PGSSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.tencent}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      UPLOAD_DIR: /app/uploads
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_API_BASE: ${QWEN_API_BASE:-}
      QWEN_MODEL: ${QWEN_MODEL:-}
      QWEN_VISION_MODEL: ${QWEN_VISION_MODEL:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      KIMI_API_BASE: ${KIMI_API_BASE:-}
      KIMI_MODEL: ${KIMI_MODEL:-}
      BAIDU_API_KEY: ${BAIDU_API_KEY:-}
      BAIDU_SECRET_KEY: ${BAIDU_SECRET_KEY:-}
    volumes:
      - backend_uploads:/app/uploads
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_HTTP_PORT:-80}:80"

volumes:
  postgres_data:
  backend_uploads:
