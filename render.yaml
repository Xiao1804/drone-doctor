services:
  # Backend API Service
  - type: web
    name: drone-doctor-api
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: drone-doctor-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: QWEN_API_KEY
        sync: false
      - key: KIMI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
    healthCheckPath: /health

  # Frontend Static Site
  - type: static
    name: drone-doctor-web
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_PERSONAL_LEARNING_EDITION
        value: "true"

databases:
  - name: drone-doctor-db
    plan: free
    databaseName: dronedoctor
    user: dronedoctor
