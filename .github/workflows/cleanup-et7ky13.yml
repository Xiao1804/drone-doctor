name: Temporary ET7KY13 cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-et7ky13.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove deprecated ET7KY13 references
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('data/decision-trees.json')
          text = path.read_text(encoding='utf-8')

          replacements = {
              '运行整机链路测试（ET7KY13），所有项PASS': '按当前可用方式完成链路/模块检查，关键功能项通过',
              '整机链路测试（ET7KY13）是否报错？': '链路/模块检查是否发现异常？',
              '运行 ET7KY13 整机链路测试，查看测试结果': '使用当前可用的链路/模块检测方式，并结合 APP 报错查看结果',
              'ET7KY13 所有测试项显示 PASS': '未发现链路/模块异常，APP 无相关报错',
              '"ET7KY13"': '"当前可用链路/模块检测方式"',
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/decision-trees.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "docs: remove deprecated ET7KY13 from decision trees"
          git push
